<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.30"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1240" height="860" fill="#070b18"/>
  <ellipse cx="300" cy="180" rx="420" ry="260" fill="url(#glow1)"/>
  <ellipse cx="980" cy="640" rx="460" ry="300" fill="url(#glow2)"/>

  <text x="620" y="46" text-anchor="middle" fill="#e2e8f0" font-size="26" font-weight="600">The Ternary and Its Machinery</text>
  <text x="620" y="72" text-anchor="middle" fill="#94a3b8" font-size="14">how everything connects — drawn 2026-11-19</text>

  <!-- connectors -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <path d="M560 118 L430 168"/>
    <path d="M680 118 L800 168"/>
    <path d="M700 118 L1010 168"/>
    <path d="M330 262 L300 330"/>
    <path d="M470 262 L600 330"/>
    <path d="M800 262 L690 330"/>
    <path d="M800 262 L800 560"/>
    <path d="M840 377 L730 377"/>
    <path d="M620 424 L620 560"/>
    <path d="M240 607 L320 607"/>
    <path d="M620 700 L620 658"/>
  </g>
  <path d="M1100 560 L1150 560 L1150 120 L724 120" stroke="#475569" stroke-width="1.4" fill="none" stroke-dasharray="4 5"/>
  <g fill="#94a3b8" font-size="12.5">
    <text x="408" y="156">approves · rules</text>
    <text x="898" y="150">commissions</text>
    <text x="330" y="306">packs · carries</text>
    <text x="724" y="300">examines</text>
    <text x="794" y="486" text-anchor="end">verdicts → shelf</text>
    <text x="785" y="366" text-anchor="middle">governs</text>
    <text x="636" y="500">state to the next agent</text>
    <text x="280" y="594" text-anchor="middle">evidence</text>
  </g>
  <text x="1166" y="345" fill="#94a3b8" font-size="12.5" transform="rotate(-90 1166 345)" text-anchor="middle">shows Ben the state of the whole</text>

  <!-- BEN -->
  <g>
    <rect x="520" y="86" width="200" height="34" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="url(#acc)" stroke-width="1.6"/>
    <text x="620" y="109" text-anchor="middle" fill="#f1f5f9" font-size="17" font-weight="700">BEN</text>
    <text x="620" y="140" text-anchor="middle" fill="#94a3b8" font-size="12">decides · approves · the human in the loop</text>
  </g>

  <!-- seats row -->
  <g>
    <rect x="230" y="168" width="200" height="94" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
    <text x="330" y="196" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">REMMY</text>
    <text x="330" y="218" text-anchor="middle" fill="#94a3b8" font-size="12">orchestrator · curator</text>
    <text x="330" y="236" text-anchor="middle" fill="#94a3b8" font-size="12">“the briefcase with a heartbeat”</text>

    <rect x="700" y="168" width="200" height="94" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
    <text x="800" y="196" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">VANE</text>
    <text x="800" y="218" text-anchor="middle" fill="#94a3b8" font-size="12">examiner · grades blind</text>
    <text x="800" y="236" text-anchor="middle" fill="#94a3b8" font-size="12">verdicts committed first</text>

    <rect x="920" y="168" width="180" height="94" rx="12" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-dasharray="5 4"/>
    <text x="1010" y="196" text-anchor="middle" fill="#cbd5e1" font-size="15" font-weight="700">CLAUDE</text>
    <text x="1010" y="218" text-anchor="middle" fill="#94a3b8" font-size="12">independent reviewer</text>
    <text x="1010" y="236" text-anchor="middle" fill="#94a3b8" font-size="12">called per task</text>
  </g>
  <text x="565" y="222" text-anchor="middle" fill="#a78bfa" font-size="12.5">letters via the Bridge ⟷</text>

  <!-- machinery row -->
  <g>
    <rect x="180" y="330" width="220" height="94" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
    <text x="290" y="358" text-anchor="middle" fill="#f1f5f9" font-size="15.5" font-weight="700">PULSE BRIDGE</text>
    <text x="290" y="380" text-anchor="middle" fill="#94a3b8" font-size="12">letters between seats</text>
    <text x="290" y="398" text-anchor="middle" fill="#94a3b8" font-size="12">carries words, never authority</text>

    <rect x="510" y="330" width="220" height="94" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="url(#acc)" stroke-width="1.6"/>
    <text x="620" y="358" text-anchor="middle" fill="#f1f5f9" font-size="15.5" font-weight="700">THE BRIEFCASE</text>
    <text x="620" y="380" text-anchor="middle" fill="#94a3b8" font-size="12">the portable contract</text>
    <text x="620" y="398" text-anchor="middle" fill="#94a3b8" font-size="12">work state, agent → agent</text>

    <rect x="840" y="330" width="220" height="94" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
    <text x="950" y="358" text-anchor="middle" fill="#f1f5f9" font-size="15.5" font-weight="700">DUENNA</text>
    <text x="950" y="380" text-anchor="middle" fill="#94a3b8" font-size="12">governance of action</text>
    <text x="950" y="398" text-anchor="middle" fill="#94a3b8" font-size="12">identity · closure · attribution</text>
  </g>

  <!-- tests + remarvis -->
  <g>
    <rect x="40" y="560" width="200" height="94" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
    <text x="140" y="588" text-anchor="middle" fill="#f1f5f9" font-size="15.5" font-weight="700">THE TESTS</text>
    <text x="140" y="610" text-anchor="middle" fill="#94a3b8" font-size="12">ladder · Part 1 · K8 · K9</text>
    <text x="140" y="628" text-anchor="middle" fill="#94a3b8" font-size="12">how claims get earned</text>

    <rect x="1000" y="560" width="200" height="94" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
    <text x="1100" y="588" text-anchor="middle" fill="#f1f5f9" font-size="15.5" font-weight="700">REMARVIS</text>
    <text x="1100" y="610" text-anchor="middle" fill="#94a3b8" font-size="12">the face · control centre</text>
    <text x="1100" y="628" text-anchor="middle" fill="#94a3b8" font-size="12">Ben’s window into it all</text>
  </g>

  <!-- shelf -->
  <g>
    <rect x="320" y="560" width="600" height="94" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="url(#acc)" stroke-width="1.6"/>
    <text x="620" y="590" text-anchor="middle" fill="#f1f5f9" font-size="17" font-weight="700">THE SHELF — THE LIBRARY</text>
    <text x="620" y="614" text-anchor="middle" fill="#94a3b8" font-size="12.5">the record · source of truth · research, examinations, registers, rulings</text>
    <text x="620" y="634" text-anchor="middle" fill="#94a3b8" font-size="12.5">the collaboration chain is what fills it</text>
  </g>

  <!-- chain strip -->
  <g>
    <rect x="320" y="700" width="600" height="60" rx="12" fill="#0f172a" fill-opacity="0.7" stroke="#334155"/>
    <text x="620" y="726" text-anchor="middle" fill="#cbd5e1" font-size="13.5">THE CHAIN:  A establishes → B reviews → C implements → D continues blind</text>
    <text x="620" y="746" text-anchor="middle" fill="#94a3b8" font-size="12">each agent authors the next case · no curator between stages · losses recorded at the hop</text>
  </g>

  <text x="620" y="812" text-anchor="middle" fill="#64748b" font-size="12">Approval is retained at the top. Everything below it carries state, evidence, or words — never authority.</text>
</svg>
