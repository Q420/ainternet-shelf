<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A0A0A">
<title>AIvory · Working Office</title>
<style>
:root{color-scheme:dark;--ground:#0A0A0A;--panel:#101214;--panel2:#14181b;--line:#252b30;--line2:#343c43;--text:#C0C0C0;--muted:#78838b;--bright:#e4e8eb;--blue:#00D4FF;--cyan:#22D3EE;--purple:#7C3AED;--good:#75c9a2;--warn:#e4b96b;--bad:#df8585;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ground);color:var(--text);font-family:var(--mono);font-size:13px}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:1px solid var(--blue);outline-offset:2px}#app{min-height:100vh;display:grid;grid-template-columns:246px minmax(0,1fr)}
.sidebar{height:100vh;position:sticky;top:0;border-right:1px solid var(--line);background:#0d0f10;display:flex;flex-direction:column;min-width:0}
.brand{height:67px;padding:17px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.brandmark{font-size:18px;letter-spacing:.16em;color:var(--bright);font-weight:700}.brandmark span{color:var(--blue)}.version{font-size:9px;color:var(--muted);letter-spacing:.12em}
.navscroll{overflow:auto;padding:17px 10px 12px;flex:1}.navlabel{font-size:9px;letter-spacing:.18em;color:#69747b;padding:7px 9px 9px;text-transform:uppercase}
.navitem{width:100%;display:flex;align-items:center;gap:10px;padding:10px 10px;border:1px solid transparent;background:transparent;text-align:left;color:#aeb6bb;margin:1px 0;border-radius:3px;min-height:39px}
.navitem:hover{background:#151a1d;color:var(--bright)}.navitem.active{background:#111a1e;border-color:#21404a;color:var(--bright)}.navitem.active .navglyph{color:var(--blue)}.navglyph{width:16px;text-align:center;color:#687780;font-size:12px}.navname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.navmeta{font-size:9px;color:var(--muted);white-space:nowrap}.navmeta.live{color:var(--cyan)}.navmeta.done{color:var(--good)}.navmeta.stalled{color:var(--warn)}.navmeta.declined{color:var(--bad)}
.navdivider{height:1px;background:var(--line);margin:15px 8px}.decision{border-top:1px solid var(--line);padding:14px 17px 17px}.decision-title{font-size:9px;letter-spacing:.16em;color:var(--purple);margin-bottom:8px}.decision-empty{font-size:11px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}.mobilebar{display:none}
.workstrip{min-height:89px;border-bottom:1px solid var(--line);background:#0d0f10;padding:12px 20px;display:grid;grid-template-columns:minmax(180px,1.3fr) minmax(220px,1.2fr) auto;gap:16px;align-items:center}
.eyebrow{font-size:9px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:7px}.jobtitle{color:var(--bright);font-size:12px;line-height:1.5;max-width:580px}.sourcechips{display:flex;gap:5px;flex-wrap:wrap}.chip{font-size:10px;padding:5px 7px;border:1px solid var(--line2);border-radius:3px;color:#aeb8be;white-space:nowrap}.chip .bytes{color:var(--muted);margin-left:5px}
.stripright{display:flex;align-items:center;gap:12px;justify-content:flex-end}.metrics{display:flex;gap:12px}.metric{min-width:42px}.metric strong{display:block;color:var(--cyan);font-size:16px;font-weight:500;line-height:1.1}.metric span{display:block;color:var(--muted);font-size:9px;letter-spacing:.08em;margin-top:4px}.refresh{border:1px solid var(--line2);background:transparent;padding:8px 10px;border-radius:3px;color:var(--text);font-size:10px;white-space:nowrap}.refresh:hover{border-color:var(--blue);color:var(--blue)}.feedtime{font-size:9px;color:var(--muted);white-space:nowrap}
.stage{padding:23px 24px 36px;min-width:0;flex:1}.stagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}.stage-title{font-size:16px;letter-spacing:.04em;color:var(--bright);font-weight:500;margin:0 0 6px}.stage-sub{font-size:10px;color:var(--muted);line-height:1.6}.section-tag{font-size:9px;letter-spacing:.12em;color:var(--blue);border:1px solid #17404b;padding:5px 7px;border-radius:3px;white-space:nowrap}
.feed-alert{border:1px solid #704646;background:#1a1111;color:#e3a0a0;padding:13px 14px;margin-bottom:17px;line-height:1.6}
.columns{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.8fr);gap:14px;align-items:start}.panel{border:1px solid var(--line);background:var(--panel);border-radius:4px;min-width:0}.panelhead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.paneltitle{font-size:10px;letter-spacing:.14em;color:#aeb8be;text-transform:uppercase}.panelhint{font-size:9px;color:var(--muted)}.panelbody{padding:13px 14px}
.chatpanel{display:flex;flex-direction:column;min-height:490px}.chatlog{padding:15px;flex:1;min-height:280px;max-height:58vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.message{max-width:92%;border-left:2px solid var(--line2);padding:2px 0 3px 11px;line-height:1.65;overflow-wrap:anywhere}.message.mine{align-self:flex-end;border-left:0;border-right:2px solid var(--blue);padding:2px 11px 3px 0;text-align:right}.message.system{max-width:100%;border-left-color:var(--purple);color:#a6a0b7;font-size:11px}.message.record{border-left-color:var(--cyan);color:#b7cbd0}.msgmeta{font-size:9px;color:var(--muted);letter-spacing:.06em;margin-bottom:5px}.msgbody{white-space:pre-wrap;color:#c8cdd0}.message.mine .msgbody{color:#d9edf2}
.emptychat{margin:auto;text-align:center;max-width:340px;padding:24px;color:var(--muted);font-size:11px;line-height:1.8}.composer{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;align-items:flex-end}.composer textarea{resize:vertical;min-height:42px;max-height:130px;flex:1;background:#0c0f10;border:1px solid var(--line2);border-radius:3px;padding:11px;color:var(--bright);line-height:1.5}.send{height:42px;padding:0 15px;background:#10252c;border:1px solid #1a6475;border-radius:3px;color:var(--blue);font-size:10px;letter-spacing:.08em}.send:hover{background:#14323a}.send:disabled{opacity:.4;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:14px}.recordrow{padding:10px 0;border-bottom:1px solid #20262a}.recordrow:last-child{border-bottom:0;padding-bottom:0}.recordname{color:var(--bright);font-size:11px;margin-bottom:5px}.recorddetail{color:var(--muted);font-size:10px;line-height:1.7}.recorddetail b{color:#aeb8be;font-weight:400}.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #20262a;font-size:10px}.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}.kv span:last-child{color:#cbd2d6;text-align:right}
.runlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}.runcard{border:1px solid var(--line);background:var(--panel);padding:13px;border-radius:4px;min-width:0}.runhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:11px}.runid{color:var(--bright);font-size:11px}.status{font-size:9px;letter-spacing:.1em;text-transform:uppercase}.status.completed{color:var(--good)}.status.stalled{color:var(--warn)}.status.declined{color:var(--bad)}.runmodel{color:var(--muted);font-size:10px;overflow-wrap:anywhere;line-height:1.5;margin-bottom:12px}.runstats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.runstats div{border-top:1px solid var(--line);padding-top:8px}.runstats strong{display:block;color:var(--cyan);font-size:15px;font-weight:400}.runstats span{font-size:9px;color:var(--muted)}
.filelist{display:flex;flex-direction:column}.fileitem{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:11px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}.fileitem:last-child{border-bottom:0}.fileicon{width:28px;height:31px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--cyan);font-size:10px}.filename{color:var(--bright);font-size:11px;overflow-wrap:anywhere}.filepath{font-size:9px;color:var(--muted);margin-top:5px}.filesize{font-size:10px;color:#aeb8be;white-space:nowrap}
.foldergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}.folder{border:1px solid var(--line);padding:13px;background:#101315;border-radius:3px;text-align:left}.folder:hover{border-color:#246173}.foldername{font-size:11px;color:var(--bright);margin-bottom:7px}.foldermeta{font-size:9px;color:var(--muted);line-height:1.5}
.emptyfact{padding:18px 14px;color:var(--muted);font-size:10px;line-height:1.7;border:1px dashed #30383d;border-radius:3px}
.two-up{display:grid;grid-template-columns:1fr 1fr;gap:12px}.resourcegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:14px}.resource{border:1px solid var(--line);padding:13px;background:var(--panel);border-radius:3px}.resource strong{font-size:19px;color:var(--cyan);font-weight:400;display:block}.resource span{font-size:9px;color:var(--muted);letter-spacing:.08em}
.smallnote{font-size:9px;color:var(--muted);line-height:1.7}.pill{display:inline-block;padding:4px 6px;border:1px solid var(--line2);border-radius:3px;font-size:9px;color:#9aa6ad}
@media(max-width:900px){#app{grid-template-columns:205px minmax(0,1fr)}.workstrip{grid-template-columns:1fr auto}.sourceblock{grid-column:1/-1;grid-row:2}.stripright{grid-column:2;grid-row:1}.metrics{gap:8px}.feedtime{display:none}.columns{grid-template-columns:minmax(0,1fr) 250px}.stage{padding:19px 16px 30px}}
@media(max-width:650px){#app{display:block}.sidebar{display:none}.main{min-height:100vh}.mobilebar{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line);background:#0d0f10}.mobilebrand{color:var(--bright);letter-spacing:.13em;font-weight:700;margin-right:auto}.mobilebrand span{color:var(--blue)}.mobilebar select{max-width:62%;background:#111719;border:1px solid var(--line2);padding:7px 8px;border-radius:3px;color:var(--text);font-size:10px}
.workstrip{padding:11px 13px;grid-template-columns:minmax(0,1fr) auto;gap:10px}.jobtitle{font-size:10px}.sourceblock{grid-column:1/-1;grid-row:2}.stripright{grid-column:2;grid-row:1;gap:8px}.metrics{gap:8px}.metric{min-width:30px}.metric strong{font-size:13px}.metric span{font-size:8px}.refresh{padding:7px 8px}.stage{padding:17px 12px 28px}.stagehead{margin-bottom:13px}.columns{grid-template-columns:1fr}.chatpanel{min-height:440px}.chatlog{max-height:48vh}.resourcegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.two-up{grid-template-columns:1fr}.runlist{grid-template-columns:1fr}.section-tag{display:none}.sourcechips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px}.chip{font-size:9px}.feedtime{display:none}}
</style>
</head>
<body>
<div id="app">
<aside class="sidebar">
 <div class="brand"><div class="brandmark">AI<span>V</span>ORY</div><div class="version">WORKING OFFICE</div></div>
 <nav class="navscroll" aria-label="Office navigation">
  <div class="navlabel">Chats</div>
  <div id="chatnav"></div>
  <div class="navdivider"></div>
  <div class="navlabel">Views</div>
  <button class="navitem" data-view="briefcase"><span class="navglyph">▤</span><span class="navname">Shared Briefcase</span></button>
  <button class="navitem" data-view="output"><span class="navglyph">↗</span><span class="navname">Output</span></button>
  <button class="navitem" data-view="resources"><span class="navglyph">⌁</span><span class="navname">Resources</span></button>
 </nav>
 <div class="decision"><div class="decision-title">DECISIONS</div><div class="decision-empty" id="decisionState">No decisions waiting</div></div>
</aside>
<main class="main">
 <div class="mobilebar"><div class="mobilebrand">AI<span>V</span>ORY</div><select id="mobileSelect" aria-label="Select chat or view"></select></div>
 <section class="workstrip" aria-label="Current work">
  <div><div class="eyebrow">Current assignment</div><div class="jobtitle" id="jobTitle">Reading live state feed…</div></div>
  <div class="sourceblock"><div class="eyebrow">Shared briefcase · sources</div><div class="sourcechips" id="sourceChips"></div></div>
  <div class="stripright"><div class="metrics" id="stripMetrics"></div><button class="refresh" id="refresh">↻ Refresh</button><div class="feedtime" id="feedTime">—</div></div>
 </section>
 <section class="stage" id="stage" aria-live="polite"></section>
</main>
</div>
<script>
(() => {
 const FEED_URL = "https://raw.githubusercontent.com/Q420/ainternet-shelf/main/aivory/feed.json";
 const REFRESH_MS = 15 * 60 * 1000;
 // Server-side state is authoritative; browser storage is not used.
 const $ = (id) => document.getElementById(id);
 const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const fmt = (n) => Number(n).toLocaleString("en-CA");
 let feed = null, feedError = false, active = "orchestrator", stateReady = false, refreshTimer = null;
 let local = {messages:{},jobs:[]};
 async function loadPersisted(){try{const r=await fetch("/api/state",{cache:"no-store"});if(!r.ok)throw new Error("state unavailable");const data=await r.json();if(!data||!data.messages||!Array.isArray(data.jobs))throw new Error("invalid state");local=data;stateReady=true}catch{stateReady=false}}
 async function serverPost(path,payload){try{const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});if(!r.ok)return null;return await r.json()}catch{return null}}
 function messages(key){return local.messages[key] || []}
 function allRuns(){return Array.isArray(feed?.historical_runs)?feed.historical_runs:(Array.isArray(feed?.runs)?feed.runs:[])}
 function allOffices(){return Array.isArray(feed?.offices)?feed.offices:[]}
 function officeFor(id){return allOffices().find(o=>o.id===id)}
 function officeKey(id){return "office:"+id}
 function statusClass(v){return ["completed","stalled","declined"].includes(v)?v:""}
 function total(key){return allRuns().reduce((s,r)=>s+(Number(r[key])||0),0)}
 function metric(label,value){return '<div class="metric"><strong>'+fmt(value)+'</strong><span>'+label+'</span></div>'}
 function statusLabel(r){return r.outcome || (r.completed ? "completed" : "unknown")}
 function modelLabel(r){return r.model || "Model not published"}
 function allNav(){
  const runs=allRuns();
  $("chatnav").innerHTML =
   navButton("orchestrator","◉","Orchestrator","COORDINATION","")+
   navButton("collaboration","⌘","Collaboration Room","SHARED","")+
   (runs.map(r=>navButton(officeKey(r.run),"▣",r.run,modelShort(r.model),statusClass(statusLabel(r)))).join(""));
  document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",active===b.dataset.view));
  document.querySelectorAll("[data-chat]").forEach(b=>b.classList.toggle("active",active===b.dataset.chat));
  const opts=[["orchestrator","Orchestrator"],["collaboration","Collaboration Room"],...runs.map(r=>[officeKey(r.run),"Office · "+r.run]),["briefcase","Shared Briefcase"],["output","Output"],["resources","Resources"]];
  $("mobileSelect").innerHTML=opts.map(([v,t])=>'<option value="'+esc(v)+'" '+(v===active?"selected":"")+'>'+esc(t)+'</option>').join("");
 }
 function navButton(key,glyph,name,meta,status){return '<button class="navitem" data-chat="'+esc(key)+'"><span class="navglyph">'+glyph+'</span><span class="navname">'+esc(name)+'</span><span class="navmeta '+esc(status)+'">'+esc(meta)+'</span></button>'}
 function modelShort(model){if(!model)return "MODEL N/A";return model.split("/").pop().slice(0,19)}
 function updateStrip(){
  if(!feed){$("jobTitle").textContent="Feed unreachable";$("sourceChips").innerHTML="";$("stripMetrics").innerHTML="";$("feedTime").textContent="";return}
  $("jobTitle").textContent=feed.job?.title || "No current assignment published";
  $("sourceChips").innerHTML=(feed.job?.sources||[]).map(s=>'<span class="chip">'+esc(s.path)+'<span class="bytes">'+fmt(s.bytes)+' B</span></span>').join("");
  $("stripMetrics").innerHTML=metric("RUNS",allRuns().length)+metric("EVENTS",total("events"))+metric("DISPATCHES",total("dispatches"));
  $("feedTime").textContent=updatedAt ? "UPDATED "+updatedAt.toLocaleTimeString() : "";
 }
 async function loadFeed(){
  $("refresh").textContent="↻ Loading";$("refresh").disabled=true;
  try{
   const response=await fetch("/api/feed",{cache:"no-store"});
   if(!response.ok)throw new Error("HTTP "+response.status);
   const data=await response.json();
   if(data.kind!=="aivory-state-feed"||!Array.isArray(data.runs))throw new Error("Unexpected feed shape");
   feed=data;feedError=false;updatedAt=new Date();
  }catch(err){feed=null;feedError=true;updatedAt=null}
  $("refresh").textContent="↻ Refresh";$("refresh").disabled=false;
  updateStrip();allNav();render();
 }
 function stageHead(title,sub,tag){return '<div class="stagehead"><div><h1 class="stage-title">'+esc(title)+'</h1><div class="stage-sub">'+esc(sub)+'</div></div>'+(tag?'<div class="section-tag">'+esc(tag)+'</div>':"")+'</div>'}
 function feedFailure(){return '<div class="feed-alert">FEED UNREACHABLE · Showing nothing rather than stale figures. Refresh to retry. No metrics, run records, or source inventory are displayed while the live state feed is unavailable.</div>'}
 function chatMessage(m){return '<article class="message '+(m.kind==="user"?"mine":m.kind==="system"?"system":m.kind==="record"?"record":"")+'"><div class="msgmeta">'+esc(m.author||"")+(m.time?" · "+esc(m.time):"")+'</div><div class="msgbody">'+esc(m.text)+'</div></article>'}
 function chatPanel(key,placeholder,disabled){
  const items=messages(key);
  const empty=items.length===0?'<div class="emptychat">'+(key==="orchestrator"?"Give the Orchestrator an assignment in your own words. A submitted request is saved as QUEUED; framework dispatch is the next layer.":key==="collaboration"?"This is the shared conversation. Only your posts and actual completion records from the live feed appear here.":"No live transcript is published for this office in the state feed. Your messages can be saved locally; live conversation wiring is not connected.")+'</div>':"";
  return '<section class="panel chatpanel"><div class="panelhead"><div class="paneltitle">'+(key==="orchestrator"?"Orchestrator chat":key==="collaboration"?"Collaboration Room":"Office conversation")+'</div><div class="panelhint">'+(key==="orchestrator"?"HUMAN ↔ ORCHESTRATOR":key==="collaboration"?"SHARED ROOM":"HUMAN ↔ OFFICE")+'</div></div><div class="chatlog" id="chatlog">'+empty+items.map(chatMessage).join("")+'</div><form class="composer" data-composer="'+esc(key)+'"><textarea name="message" rows="2" placeholder="'+esc(placeholder)+'" aria-label="Message" '+(disabled?"disabled":"")+' required></textarea><button class="send" type="submit" '+(disabled?"disabled":"")+'>SEND</button></form></section>';
 }
 function renderChat(key){
  if(!feed){$("stage").innerHTML=stageHead("Working office","The dashboard is connected to the live state feed.","LIVE STATE")+feedFailure()+chatPanel(key,"",true);return}
  if(key==="orchestrator"){
   $("stage").innerHTML=stageHead("Orchestrator","The front door to the office. System replies report only actions this interface actually performs.","COORDINATION")+
   '<div class="columns">'+chatPanel(key,"Describe the work to assign…",false)+'<div class="stack"><section class="panel"><div class="panelhead"><div class="paneltitle">Assignment</div><div class="panelhint">FROM LIVE FEED</div></div><div class="panelbody">'+
   '<div class="recordname">'+esc(feed.job?.title||"No assignment published")+'</div><div class="recorddetail">Target: <b>'+(feed.job?.target_words==null?"Not published":fmt(feed.job.target_words)+" words")+'</b><br>Floor: <b>'+(feed.job?.floor_words==null?"Not published":fmt(feed.job.floor_words)+" words")+'</b></div></div></section>'+
   '<section class="panel"><div class="panelhead"><div class="paneltitle">Queued requests</div><div class="panelhint">THIS BROWSER</div></div><div class="panelbody">'+(local.jobs.length?local.jobs.map(j=>'<div class="recordrow"><div class="recordname">QUEUED · '+esc(j.time)+'</div><div class="recorddetail">'+esc(j.text)+'</div></div>').join(""):'<div class="emptyfact">No job requests have been saved in this browser.</div>')+'</div></section>'+
   '<div class="smallnote">Dispatch wiring is the next layer. Saving a request here does not create or start a framework agent.</div></div></div>';
  }else if(key==="collaboration"){
   const records=allRuns().filter(r=>r.completed===true&&r.outcome==="completed").map(r=>({kind:"record",author:"FRAMEWORK RECORD · "+r.run,time:"FEED",text:"Run completed. "+fmt(r.iterations)+" iterations · "+fmt(r.events)+" events · "+fmt(r.dispatches)+" dispatches."}));
   const saved=messages(key);
   const merged=[...records,...saved].sort((a,b)=>(a.time==="FEED"?0:1)-(b.time==="FEED"?0:1));
   $("stage").innerHTML=stageHead("Collaboration Room","The shared conversation. Record entries appear only when backed by a completed run in the live feed.","SHARED ROOM")+
   '<section class="panel chatpanel"><div class="panelhead"><div class="paneltitle">Crew conversation</div><div class="panelhint">HUMAN POSTS + VERIFIED COMPLETIONS</div></div><div class="chatlog" id="chatlog">'+(merged.length?merged.map(chatMessage).join(""):'<div class="emptychat">No human posts or completed-run entries are present.</div>')+'</div><form class="composer" data-composer="collaboration"><textarea name="message" rows="2" placeholder="Contribute to the shared work…" required></textarea><button class="send" type="submit">SEND</button></form></section>';
  }else{
   const id=key.slice(7),r=runFor(id);
   if(!r){$("stage").innerHTML=stageHead("Office","This office is not present in the current feed.","OFFICE");return}
   const msgs=messages(key);
   $("stage").innerHTML=stageHead("Office · "+id,"Occupant model: "+modelLabel(r)+". The office is the durable work identity; the model is the feed-reported occupant.","OFFICE")+
   '<div class="columns">'+chatPanel(key,"Write to this office…",false)+'<div class="stack">'+
   '<section class="panel"><div class="panelhead"><div class="paneltitle">Journal</div><div class="panelhint">OFFICE RECORD</div></div><div class="panelbody"><div class="emptyfact">No journal entries or dated briefs for this office are published in the live state feed.</div></div></section>'+
   '<section class="panel"><div class="panelhead"><div class="paneltitle">Record</div><div class="panelhint">'+esc(r.run)+'</div></div><div class="panelbody">'+
   '<div class="recordrow"><div class="recordname">'+esc(statusLabel(r).toUpperCase())+'</div><div class="recorddetail">Model: <b>'+esc(modelLabel(r))+'</b><br>Iterations: <b>'+fmt(r.iterations)+'</b><br>Events: <b>'+fmt(r.events)+'</b><br>Dispatches: <b>'+fmt(r.dispatches)+'</b><br>Brief filed: <b>'+String(Boolean(r.brief_filed))+'</b><br>Brief words: <b>'+(r.brief_words==null?"Not recorded":fmt(r.brief_words))+'</b></div></div></div></section>'+
   '<div class="smallnote">A chat transcript is not included in the published feed for this office. No agent dialogue is fabricated.</div></div></div>';
  }
 }
 function renderBriefcase(){
  const sources=feed?.job?.sources||[],runs=allRuns();
  $("stage").innerHTML=stageHead("Shared Briefcase","One shared working ground, with a folder for each office. Access activity is shown only when the feed publishes it.","SHARED CONTEXT")+
  '<section class="panel"><div class="panelhead"><div class="paneltitle">Shared sources</div><div class="panelhint">'+sources.length+' ITEMS · TRUE FEED BYTE SIZES</div></div><div class="filelist">'+(sources.length?sources.map(s=>'<div class="fileitem"><div class="fileicon">MD</div><div><div class="filename">'+esc(s.path)+'</div><div class="filepath">Shared source</div></div><div class="filesize">'+fmt(s.bytes)+' B</div></div>').join(""):'<div class="emptyfact">No shared sources are published in the live feed.</div>')+'</div></section>'+
  '<div style="height:14px"></div><section class="panel"><div class="panelhead"><div class="paneltitle">Office folders</div><div class="panelhint">'+runs.length+' OFFICES IN FEED</div></div><div class="panelbody"><div class="foldergrid">'+runs.map(r=>'<button class="folder" data-open-office="'+esc(r.run)+'"><div class="foldername">▱ &nbsp;'+esc(r.run)+'</div><div class="foldermeta">'+esc(modelLabel(r))+'<br>'+esc(statusLabel(r))+' · '+fmt(r.events)+' events</div></button>').join("")+'</div></div></section>'+
  '<div style="height:12px"></div><div class="smallnote">No item-level access events are published in this feed snapshot. Source sizes above are the exact byte counts supplied by the feed.</div>';
 }
 function renderOutput(){
  const filed=allRuns().filter(r=>r.brief_filed===true);
  $("stage").innerHTML=stageHead("Output","Files and deliverables recorded by the framework. No artifact is represented unless the feed records it.","DELIVERABLES")+
  '<section class="panel"><div class="panelhead"><div class="paneltitle">Filed briefs</div><div class="panelhint">'+filed.length+' RECORDED</div></div><div class="filelist">'+(filed.length?filed.map(r=>'<div class="fileitem"><div class="fileicon">BR</div><div><div class="filename">Brief filed · '+esc(r.run)+'</div><div class="filepath">'+esc(modelLabel(r))+'</div></div><div class="filesize">'+(r.brief_words==null?"Word count unavailable":fmt(r.brief_words)+" words")+'</div></div>').join(""):'<div class="emptyfact">No filed briefs are recorded in the live feed.</div>')+'</div></section>'+
  '<div style="height:12px"></div><div class="smallnote">The feed records filing and word counts, but does not publish artifact paths or file bytes. No download links are inferred.</div>';
 }
 function renderResources(){
  const runs=allRuns();
  $("stage").innerHTML=stageHead("Resources","Usage figures are computed directly from the current state feed at render time.","LIVE ACCOUNTING")+
  '<div class="resourcegrid">'+
  '<div class="resource"><strong>'+fmt(total("iterations"))+'</strong><span>ITERATIONS</span></div>'+
  '<div class="resource"><strong>'+fmt(total("events"))+'</strong><span>EVENTS</span></div>'+
  '<div class="resource"><strong>'+fmt(total("dispatches"))+'</strong><span>DISPATCHES</span></div>'+
  '<div class="resource"><strong>'+fmt(runs.length)+'</strong><span>RECORDED RUNS</span></div></div>'+
  '<section class="panel"><div class="panelhead"><div class="paneltitle">Run resource ledger</div><div class="panelhint">PER-RUN COUNTS FROM FEED</div></div><div class="panelbody"><div class="runlist">'+runs.map(r=>'<article class="runcard"><div class="runhead"><div class="runid">'+esc(r.run)+'</div><div class="status '+statusClass(statusLabel(r))+'">'+esc(statusLabel(r))+'</div></div><div class="runmodel">'+esc(modelLabel(r))+'</div><div class="runstats"><div><strong>'+fmt(r.iterations)+'</strong><span>ITERATIONS</span></div><div><strong>'+fmt(r.events)+'</strong><span>EVENTS</span></div><div><strong>'+fmt(r.dispatches)+'</strong><span>DISPATCHES</span></div></div></article>').join("")+'</div></div></section>'+
  '<div style="height:12px"></div><div class="smallnote">Token consumption, time, and per-call payloads are not present in the published feed and are therefore not estimated here.</div>';
 }
 function render(){
  if(!feed){$("stage").innerHTML=stageHead("Working office","The live state feed is required for every figure and record.","LIVE STATE")+feedFailure();return}
  if(active==="briefcase")renderBriefcase();
  else if(active==="output")renderOutput();
  else if(active==="resources")renderResources();
  else renderChat(active);
  allNav();
  const log=$("chatlog");if(log)log.scrollTop=log.scrollHeight;
 }
 function setActive(v){active=v;allNav();render()}
 document.addEventListener("click",e=>{
  const c=e.target.closest("[data-chat]");if(c){setActive(c.dataset.chat);return}
  const v=e.target.closest("[data-view]");if(v){setActive(v.dataset.view);return}
  const f=e.target.closest("[data-open-office]");if(f){setActive(officeKey(f.dataset.openOffice));return}
 });
 $("mobileSelect").addEventListener("change",e=>setActive(e.target.value));
 $("refresh").addEventListener("click",loadFeed);
 document.addEventListener("submit",async e=>{
  const form=e.target.closest("[data-composer]");if(!form)return;
  e.preventDefault();const key=form.dataset.composer;const field=form.elements.message;const value=field.value.trim();if(!value)return;
  const now=new Date().toLocaleString();const send=form.querySelector("button");send.disabled=true;
  if(key==="orchestrator"){
   const result=await serverPost("/api/jobs",{text:value});
   if(result?.state){local=result.state;saveLocal()}
   else{
    const job={text:value,time:now,id:Date.now()};local.jobs.push(job);
    pushMessage(key,{kind:"user",author:"BEN",time:now,text:value});
    pushMessage(key,{kind:"system",author:"SYSTEM",time:now,text:"Server storage unavailable. Request saved in this browser only; it is not in the framework queue."});
   }
  }else{
   const result=await serverPost("/api/messages",{key,text:value});
   if(result?.state){local=result.state;saveLocal()}
   else{
    pushMessage(key,{kind:"user",author:"BEN",time:now,text:value});
    if(key!=="collaboration")pushMessage(key,{kind:"system",author:"SYSTEM",time:now,text:"QUEUED · Message saved in this browser only. Live office conversation wiring is not connected."});
   }
  }
  field.value="";render();
 });
 async function boot(){await loadPersisted();await loadFeed()}
 boot();
 refreshTimer=setInterval(loadFeed,REFRESH_MS);
 window.addEventListener("beforeunload",()=>{if(refreshTimer)clearInterval(refreshTimer)});
})();
</script>
</body>
</html>
